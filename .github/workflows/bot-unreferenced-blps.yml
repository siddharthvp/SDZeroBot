name: unreferenced-blps
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install mwn
        run: |
          cd ${{ github.workspace }}/.. 
          git clone https://github.com/siddharthvp/mwn.git 
          cd mwn
          npm ci
          npm run build
      - run: npm ci
      - run: npm run tsc

      - name: Run task
        run: node ${{ github.workspace }}/reports/unreferenced-blps.js
        env:
          AUTH: ${{ secrets.BOT_AUTH }}
