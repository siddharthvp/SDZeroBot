name: draftify-watch
on:
  schedule:
    - cron: '5 0 * * 2'
  workflow_dispatch:

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run tsc
      - name: Write credentials
        run: echo "${{ secrets.BOT_AUTH }}" > "${{ github.workspace }}/.auth.js"

      - name: Run task
        run: node ${{ github.workspace }}/reports/draftify-watch.js

      - name: Cleanup credentials
        if: always()
        run: rm -f ${{ github.workspace }}/.auth.js
